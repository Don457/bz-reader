<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>bz Reader · 漫画阅读</title>
<style>
  :root {
    --paper: #f3ece0;
    --card: #fcf9f2;
    --ink: #241f18;
    --gold: #a2722b;
    --line: rgba(84, 66, 38, .14);
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vh 5vw;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
  }
  .sheet { width: min(1400px, 94vw); }

  .bar { width: 60px; height: 6px; background: var(--gold); margin-bottom: 24px; }
  h1 { font-size: clamp(40px, 4.6vw, 62px); font-weight: 700; line-height: 1.1; }
  .rule { height: 1px; background: var(--line); margin: 28px 0 32px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
  }
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    min-height: 150px;
    display: flex;
    align-items: center;
    padding: 24px 30px 24px 38px;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 22px; bottom: 22px;
    width: 5px;
    background: var(--gold);
  }
  .card span { font-size: clamp(20px, 2vw, 28px); font-weight: 700; line-height: 1.3; }

  /* 矮屏（笔记本 / 全屏前）压缩留白，保证 9 张卡仍在一屏内 */
  @media (max-height: 820px) {
    body { padding: 3vh 5vw; }
    .bar { margin-bottom: 16px; }
    .rule { margin: 18px 0 22px; }
    .grid { gap: 16px; }
    .card { min-height: 118px; padding: 18px 24px 18px 32px; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="bar"></div>
  <h1>漫画阅读</h1>
  <div class="rule"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
/* 9 项功能名与 PPT / 对照表同源 */
const ITEMS = [
  'CBZ / 文件夹打开即读',
  'ComicInfo 方向自动跟随',
  '右到左 / 左到右',
  '单页 / 双页，跨页自动拆合',
  '一屏一页 / 连续 / 条漫',
  '逐格读：自动分格、防剧透',
  '六档适配 + 缩放拖动',
  '裁白边、一键调色',
  '页缩略图、读到哪记住',
];
document.getElementById('grid').innerHTML = ITEMS.map(t => `<div class="card"><span>${t}</span></div>`).join('');
</script>
</body>
</html>
