<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>bz Reader · 漫画功能对照（视频用）</title>
<style>
  :root {
    --paper: #f3ece0;
    --card: #fcf9f2;
    --ink: #241f18;
    --ink2: #57503f;
    --ink3: #8a8071;
    --gold: #a2722b;
    --line: rgba(84, 66, 38, .14);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3vh 4vw;
    font: 400 22px/1.4 var(--sans);
    color: var(--ink);
    background: var(--paper);
  }
  .sheet { width: min(1100px, 92vw); }

  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2.2vh; }
  .title { font: 500 54px/1.1 var(--serif); letter-spacing: .01em; }
  .title em { color: var(--gold); font-style: normal; }
  .badge {
    font-size: 18px; letter-spacing: .06em; color: var(--gold);
    padding: 8px 20px; border: 1px solid var(--line);
    border-radius: 999px; background: rgba(255, 252, 244, .55);
  }
  .lede { margin: 0 0 2.4vh; font-size: 20px; color: var(--ink2); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1.2vh 2.2vw;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.35vh 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .name { font-size: 26px; line-height: 1.25; color: #2f2921; }
  .col { width: 150px; text-align: center; flex: 0 0 auto; }
  .head { font-size: 15px; letter-spacing: .16em; color: var(--ink3); padding: 0 0 1vh; }
  .head.pro { color: var(--gold); }
  .yes { color: var(--gold); }
  .no { color: rgba(84, 66, 38, .28); }
  .yes svg, .no svg { display: block; margin: 0 auto; }

  .hint { margin-top: 1.6vh; font-size: 15px; color: var(--ink3); text-align: right; }

  /* 视频里有时要「只留漫画段、再放大」：F11 全屏 + Ctrl/+ 缩放即可 */
  @media (max-height: 720px) {
    .title { font-size: 40px; }
    .lede { font-size: 17px; margin-bottom: 1.4vh; }
    .row { padding: 1vh 0; }
    .name { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="top">
    <div class="title">漫画 · <em>9 项高级功能</em></div>
    <div class="badge">基础版 / 高级版</div>
  </div>
  <p class="lede">CBZ / 文件夹打开即读，整本按漫画的方式翻。</p>

  <div class="card">
    <div class="row" style="border-bottom:2px solid var(--line)">
      <div class="name" style="font-size:15px;letter-spacing:.16em;color:var(--ink3)">功能</div>
      <div class="col head">基础版</div>
      <div class="col head pro">高级版</div>
    </div>
    <div id="rows"></div>
  </div>
  <p class="hint">F11 全屏 · Ctrl + / − 缩放</p>
</div>

<script>
/* 数据来自 assets/plan-compare/plan.json 的「漫画」组（真源导出） */
const ROWS = [
  'CBZ / 文件夹打开即读',
  'ComicInfo 方向自动跟随',
  '右到左 / 左到右',
  '单页 / 双页，跨页自动拆合',
  '一屏一页 / 连续 / 条漫',
  '逐格读：自动分格、防剧透',
  '六档适配 + 缩放拖动',
  '裁白边、一键调色',
  '页缩略图、读到哪记住',
];
const TICK = '<svg viewBox="0 0 20 20" width="24" height="24" aria-hidden="true"><path d="M3.6 10.6 8 15 16.4 5.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DASH = '<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

document.getElementById('rows').innerHTML = ROWS.map(name =>
  `<div class="row">
     <div class="name">${name}</div>
     <div class="col"><span class="no">${DASH}</span></div>
     <div class="col"><span class="yes">${TICK}</span></div>
   </div>`
).join('');
</script>
</body>
</html>
